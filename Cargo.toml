[package]
name = "seol-gitops-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "seol-gitops 클러스터 구성 스모크 테스트용 간이 HTTP 서버"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
