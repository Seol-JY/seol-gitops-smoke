name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/seol-jy/seol-gitops-smoke

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    concurrency: gitops-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Seol-JY/seol-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - name: 이미지 태그 갱신
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          yq -i '(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)' apps/gitops-smoke/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git commit -am "chore(gitops-smoke): 이미지 태그 ${TAG} 갱신"
          git push
